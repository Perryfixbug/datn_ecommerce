openapi: 3.0.0
info:
  title: Furniture shop API
  version: 0.0.0
tags:
  - name: health
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Common.LoginResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Common.LoginRequest"
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Common.LogoutRequest"
  /api/v1/auth/me:
    get:
      operationId: me
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Common.AuthUser"
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Common.LoginResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Common.RefreshRequest"
  /api/v1/common/conventions:
    get:
      operationId: getCommonConventions
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    $ref: "#/components/schemas/Common.TokenPair"
                  permission:
                    $ref: "#/components/schemas/Common.Permission"
                  list:
                    type: object
                    required:
                      - nextCursor
                      - total
                      - items
                    properties:
                      nextCursor:
                        type: string
                        nullable: true
                      total:
                        type: integer
                        format: int64
                      items:
                        type: array
                        items:
                          type: string
                  error:
                    $ref: "#/components/schemas/Common.ErrorResponse"
                required:
                  - tokens
                  - permission
                  - list
                  - error
  /api/v1/health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Common.HealthStatus"
      tags:
        - health
components:
  schemas:
    Common.AuthUser:
      type: object
      required:
        - id
        - email
        - name
        - role
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
    Common.ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/Common.ErrorDetail"
        correlationId:
          type: string
    Common.ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    Common.ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Common.ErrorBody"
    Common.HealthStatus:
      type: object
      required:
        - status
        - uptime
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - down
        uptime:
          type: number
          format: double
          minimum: 0
        timestamp:
          type: string
          format: date-time
    Common.LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    Common.LoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/Common.AuthUser"
    Common.LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
    Common.Permission:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    Common.RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    Common.TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
