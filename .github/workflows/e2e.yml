name: E2E

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  BACKEND_URL: http://localhost:4000

jobs:
  playwright:
    name: Playwright (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: storefront
            url: http://localhost:3000
          - app: admin
            url: http://localhost:3002
    env:
      NEXT_PUBLIC_APP_URL: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter ${{ matrix.app }} exec playwright install --with-deps

      # Turbo build trước khi Playwright khởi động server production.
      - name: Run E2E
        run: pnpm exec turbo run test:e2e --filter=${{ matrix.app }}

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/playwright-report
            apps/${{ matrix.app }}/test-results
          retention-days: 14
